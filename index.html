<style>

  --paid: #7A2850; --paid-bg: #F6E7EE;
  --bottle: #1E3A6E; --bottle-bg: #E5EBF5;
  --plain: #4F4842; --plain-bg: #ECE8E3;

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

}
a { color: var(--amber-dk); }

.exticon { flex: none; margin-left: 3px; vertical-align: -1px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 5px #fff; }
.band :focus-visible { outline-color: var(--gold); box-shadow: none; }

mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.chev { flex: none; color: var(--ink-3); font-size: 22px; line-height: 1; }

/* 読み込み中 */
.loading { padding: 32px 16px; text-align: center; color: var(--ink-2); }
.loading strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 8px; }

/* ヘッダー帯（ホーム） */
.band { background: var(--oak); color: #fff; border-bottom: 1px solid var(--gold-line); }
.band .wrap { position: relative; padding-top: 16px; padding-bottom: 14px; }
.band h1 { margin: 0 0 6px; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; font-size: 20px; line-height: 1.35; font-weight: 700; }
.band h1 .band-sub { display: block; font-size: 14px; color: var(--gold); letter-spacing: .04em; }
.band-event { margin: 0; font-size: 13px; color: #E8E1D8; }
.fs { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.band .fs { position: absolute; right: 12px; top: 6px; color: var(--gold); }

/* 検索行（sticky） */
.searchbar { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 6px 0; border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; height: 44px; padding-left: 12px; background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 12px; }
.search:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
.search svg { flex: none; color: var(--ink-3); }
.search input { flex: 1; min-width: 0; height: 100%; padding: 0 8px; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 16px; }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
.clear { flex: none; width: 44px; height: 44px; border: 0; background: none; color: var(--ink-2); font-size: 22px; line-height: 1; }

/* 絞り込みチップ（操作できる） */
.chips { display: flex; align-items: center; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; margin: 4px 0; padding: 0 14px; border: 1.5px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip[aria-pressed="true"]::before { content: "✓ "; }
.chip-sep { flex: none; width: 1px; height: 24px; background: var(--line-strong); }
.chip-clear { flex: none; min-height: 44px; padding: 0 8px; border: 0; background: none; color: var(--amber-dk); font-size: 14px; font-weight: 700; text-decoration: underline; }

/* 提供形態ラベル（操作できない） */
.lbls { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.lbl { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 700; line-height: 1; white-space: nowrap; }
.l-free { color: var(--free); background: var(--free-bg); }
.l-paid { color: var(--paid); background: var(--paid-bg); }

.l-reserve { color: var(--bottle); background: #fff; box-shadow: inset 0 0 0 1.5px var(--bottle); }
.l-goods, .l-food, .l-other, .l-plain { color: var(--plain); background: var(--plain-bg); }
.l-limited { color: var(--gold); background: var(--ink); }
.l-warn { color: var(--warn); background: var(--warn-bg); }

/* ブースNo.バッジ（琥珀はここと主要ボタンだけ） */
.booth { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 10px; background: var(--amber); color: #fff; font-size: 22px; font-weight: 700; line-height: 1; }
.booth.sm { width: 36px; height: 36px; border-radius: 8px; font-size: 17px; }
.booth.xs { width: 24px; height: 24px; border-radius: 6px; font-size: 13px; }
.booth.lg { width: 64px; height: 64px; border-radius: 12px; font-size: 32px; }
.booth.lg small { font-size: 10px; letter-spacing: .08em; margin-bottom: 4px; }

/* 情報行・注記 */
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
.meta strong { color: var(--ink); }
.extlink { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 700; }
.disclaimer, .notice { margin: 4px 0 8px; font-size: 13px; color: var(--ink-2); }

.fine { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.footnote { margin: 16px 0; font-size: 13px; color: var(--ink-2); }
.linkish { padding: 0; border: 0; background: none; color: var(--amber-dk); font-weight: 700; text-decoration: underline; min-height: 44px; }

/* リスト（白地のシート＋区切り線） */
.sheet { margin: 0 -16px; padding: 0; list-style: none; background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.sheet > li + li, .sub > li + li { border-top: 1px solid var(--line); }

.exrow, .prow, .grp-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: inherit; text-decoration: none; }

.exrow-main, .prow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.exrow-name { font-size: 17px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.exrow-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 14px; color: var(--ink-2); }
.cnt { font-size: 14px; color: var(--ink-2); }
.prow-kicker { font-size: 13px; color: var(--ink-2); }
.prow-name { font-size: 17px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.prow-spec { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.prow-price { font-size: 15px; font-weight: 700; }
.muted { color: var(--ink-3) !important; }
.thumb { flex: none; width: 56px; height: 75px; object-fit: contain; background: var(--img-bg); border: 1px solid var(--line); border-radius: 8px; }
.lrow { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; }
.lrow-name { font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.note-row { padding: 8px 16px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.grp-h { padding: 10px 16px 6px; background: var(--bg); font-size: 14px; font-weight: 700; color: var(--ink-2); }
.grp-head { min-height: 56px; background: var(--bg); }
.grp-name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.sub { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.seeall { display: flex; align-items: center; justify-content: space-between; min-height: 48px; margin-top: 4px; font-weight: 700; text-decoration: none; }
.morebtn, .btn { display: block; width: 100%; min-height: 48px; margin: 12px 0; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface); font-weight: 700; }
.btn-primary { border-color: var(--amber); background: var(--amber); color: #fff; }

/* 限定ボトル枠 */
.featured { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 8px; list-style: none; scroll-snap-type: x proximity; scroll-padding: 0 16px; scrollbar-width: thin; }
.fcard { flex: none; width: 132px; display: flex; flex-direction: column; gap: 6px; color: inherit; text-decoration: none; scroll-snap-align: start; }
.ph { display: block; aspect-ratio: 3 / 4; background: var(--img-bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.ph img, .tile img { display: block; width: 100%; height: 100%; object-fit: contain; background: #fff; }
.fcard-name { font-size: 15px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fcard-price { font-size: 17px; font-weight: 700; }
.fcard-ex { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }

.boothblock-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.priceblock { margin: 16px 0; padding: 16px; background: var(--surface); border: 1px solid var(--block-line); border-radius: 12px; }
.price-main { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2; }

.price-rows { margin: 8px 0 0; }
.price-rows div, .spec div { display: flex; gap: 12px; padding: 4px 0; }

.spec { margin: 0; }

.srcs { margin: 0; padding-left: 1.2em; font-size: 14px; }
.srcs li { margin: 4px 0; }
.srcs .raw { list-style: none; margin-left: -1.2em; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }

/* フッター */
.foot { margin-top: 40px; padding: 20px 0 32px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.foot p { margin: 0 0 8px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script>
"use strict";
(function () {
const APP = document.getElementById("app");
const D = window.DATA;
const SITE = D.site || {};
const OFFICIAL_TOP = "https://whiskyfestival.jp/tokyo2026/";
const MAP_URL = "https://whiskyfestival.jp/tokyo2026/pickup/#16868";
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ===== データ準備 ===== */
const EX = D.exhibitors;
const EX_BY = Object.fromEntries(EX.map(e => [e.slug, e]));
const BOOTHS = EX.filter(e => e.booth != null);
const PRODUCTS = [];
for (const e of EX) {
  e.byId = {};
  e.offerSet = new Set();
  for (const p of e.products) {
    p.ex = e; e.byId[p.id] = p; PRODUCTS.push(p);
    p.offers.forEach(o => e.offerSet.add(o));
  }
}
const UNLISTED_N = EX.filter(e => !e.products.length).length;
const byBooth = (a, b) => (a.ex.booth ?? 999) - (b.ex.booth ?? 999);
const LIMITED = PRODUCTS.filter(p => p.limited).sort(byBooth);
const FEATURED = LIMITED.filter(p => p.images && p.images.length);

/* 検索用の正規化（表示は原文のまま） */
function norm(s) {
  return String(s || "").normalize("NFKC").toLowerCase()
    .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
    .replace(/ヴァ/g, "バ").replace(/ヴィ/g, "ビ").replace(/ヴェ/g, "ベ").replace(/ヴォ/g, "ボ").replace(/ヴ/g, "ブ")
    .replace(/蒸溜/g, "蒸留").replace(/°/g, "%")
    .replace(/(\d+)\s*years?\s*old/g, "$1年")
    .replace(/[\s・·'’`"”“\-–—_.,\/()（）「」『』【】|:：!！?？&＆~〜]/g, "");
}
const ALIAS_N = D.aliases.map(g => g.map(norm));
for (const e of EX) e.hayName = norm(e.name);
for (const p of PRODUCTS) {
  p.hay = norm([p.name, p.nameEn, p.raw, p.group, p.series, p.headline, p.distillery, p.region, p.cask, p.category, (p.tags || []).join(" ")].join(" "));
}

/* 英語表記の蒸留所名に添えるカタカナ（辞書の蒸留所・ブランド部分だけを使う） */
const KANA = D.aliases.slice(0, Math.max(0, D.aliases.findIndex(g => g[0] === "Kanpaikai")))
  .map(g => ({ en: g[0].toLowerCase(), ja: g.find(x => /[゠-ヿ一-鿿]/.test(x)) }))
  .filter(k => k.ja).sort((a, b) => b.en.length - a.en.length);
function kanaOf(name) {
  if (/[぀-ヿ一-鿿]/.test(name)) return "";
  const n = name.toLowerCase().replace(/^the\s+/, "");
  const hit = KANA.find(k => n === k.en || n.startsWith(k.en + " ") || n.startsWith(k.en + "-"));
  return hit ? hit.ja : "";
}

/* ===== 表示用の定数 ===== */
const OFFER_ORDER = ["free", "paid", "bottle", "reserve", "goods", "food"];
const OFFER_LABEL = { free: "無料試飲", paid: "有料試飲", bottle: "ボトル販売", reserve: "予約受付", goods: "グッズ", food: "食品", other: "出品" };
const GENRE_LABEL = { japanese: "ジャパニーズ", world: "ワールド", gin: "ジン", spirits: "スピリッツ" };
const has = (p, ...os) => os.some(o => p.offers.includes(o));
/* 絞り込み：グループ内はOR、グループ間はAND。1つ目（提供形態）は検索中は商品に効かせる */
const CHIP_GROUPS = [
  [
    { k: "free", label: "無料試飲", ex: e => e.free, p: p => has(p, "free") },
    { k: "paid", label: "有料試飲", ex: e => e.offerSet.has("paid"), p: p => has(p, "paid") },
    { k: "bottle", label: "ボトル販売", ex: e => e.attrs.includes("bottle") || e.offerSet.has("bottle") || e.offerSet.has("reserve"), p: p => has(p, "bottle", "reserve") },
    { k: "limited", label: "会場限定あり", ex: e => e.products.some(p => p.limited), p: p => !!p.limited },
    { k: "goods", label: "グッズ・フード", ex: e => e.attrs.includes("goods") || e.attrs.includes("food"), p: p => has(p, "goods", "food") },
  ],
  Object.entries(GENRE_LABEL).map(([k, label]) => ({ k, label, ex: e => e.attrs.includes(k) })),
  [{ k: "listed", label: "出品リストあり", ex: e => e.products.length > 0 }],
];
const TABS = [
  { k: "all", label: "すべて" },
  { k: "free", label: "無料試飲", offers: ["free"] },
  { k: "paid", label: "有料試飲", offers: ["paid"] },
  { k: "bottle", label: "ボトル販売", offers: ["bottle"] },
  { k: "reserve", label: "予約受付", offers: ["reserve"] },
  { k: "goods", label: "グッズ・食品", offers: ["goods", "food"] },
  { k: "other", label: "その他", offers: ["other"] },
];
const SHORT_NOTES = ["他", "等", "など", "その他", "ほか", "他多数", "他各種"];

/* ===== 状態 ===== */
const S = { q: "", sel: new Set(), tab: {}, more: false, hl: null };
const NAV = { stack: [], scroll: {}, rendered: false };
try { S.q = sessionStorage.getItem("wf26-q") || ""; } catch (e) { /* 使えない環境では復元しない */ }

/* ===== ユーティリティ ===== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const num = n => Number(n).toLocaleString("ja-JP");
const yen = n => num(n) + "円";
const fmtDate = s => { const m = String(s || "").match(/\d{4}-(\d{2})-(\d{2})(?:\s+(\d{1,2}:\d{2}))?/); return m ? `${+m[1]}/${+m[2]}${m[3] ? " " + m[3] : ""}` : s; };
/* 外部リンク（新しいタブ）。矢印は端末のフォントに左右されないようSVGで描く */
const EXT_ICON = `<svg class="exticon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5h5v5M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ext = (href, text, cls = "") => `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${text}${EXT_ICON}<span class="sr">（新しいタブで開きます）</span></a>`;
const exHref = e => "#/e/" + encodeURIComponent(e.slug);
const pHref = p => `#/p/${encodeURIComponent(p.ex.slug)}/${encodeURIComponent(p.id)}`;
const boothName = e => (e.booth != null ? `No.${e.booth} ` : "") + e.name;
function imgUrl(u, size) { return /pbs\.twimg\.com/.test(u) ? u + (u.includes("?") ? "&" : "?") + "name=" + size : u; }
function hl(text) {
  text = String(text ?? "");
  if (!S.hl) return esc(text);
  let out = "", last = 0;
  text.replace(S.hl, (m, i) => { out += esc(text.slice(last, i)) + "<mark>" + esc(m) + "</mark>"; last = i + m.length; return m; });
  return out + esc(text.slice(last));
}
window.wfImgFail = function (img) {
  const wrap = img.closest(".tiles-wrap");
  (img.closest(".tile") || img).remove();
  if (wrap && !wrap.querySelector(".tile")) wrap.remove();
};

/* ===== 検索 ===== */
function expandQuery(q) {
  const terms = [], show = [];
  for (const w of q.normalize("NFKC").split(/\s+/).filter(Boolean)) {
    const t = norm(w);
    if (!t) continue;
    const alts = new Set([t]);
    show.push(w);
    if (t.length >= 2) ALIAS_N.forEach((g, i) => {
      if (g.some(a => a.startsWith(t))) { g.forEach(a => alts.add(a)); D.aliases[i].forEach(r => show.push(r)); }
    });
    terms.push([...alts]);
  }
  return { terms, show };
}
/* 商品名などで一致する語が1つ以上必要（出展社名だけの一致では商品を出さない） */
function productMatch(p, terms) {
  let own = false;
  for (const alts of terms) {
    const inOwn = alts.some(a => p.hay.includes(a));
    if (!inOwn && !alts.some(a => p.ex.hayName.includes(a))) return false;
    own = own || inOwn;
  }
  return own;
}
function passEx(e) {
  return CHIP_GROUPS.every(g => { const on = g.filter(c => S.sel.has(c.k)); return !on.length || on.some(c => c.ex(e)); });
}
function passProduct(p) {
  return CHIP_GROUPS.every((g, i) => {
    const on = g.filter(c => S.sel.has(c.k));
    return !on.length || on.some(c => (i === 0 ? c.p(p) : c.ex(p.ex)));
  });
}
function search(q) {
  const { terms, show } = expandQuery(q);
  S.hl = show.length ? new RegExp(show.map(reEsc).sort((a, b) => b.length - a.length).join("|"), "gi") : null;
  const t = q.trim();
  const boothHit = /^\d{1,3}$/.test(t) ? BOOTHS.find(e => e.booth === Number(t)) : null;
  const exHits = terms.length ? EX.filter(e => e !== boothHit && terms.every(alts => alts.some(a => e.hayName.includes(a))) && passEx(e)) : [];
  const pHits = terms.length ? PRODUCTS.filter(p => productMatch(p, terms) && passProduct(p)).sort(byBooth) : [];
  return { boothHit, exHits, pHits };
}
function groupByBooth(ps) {
  const m = new Map();
  for (const p of ps) { if (!m.has(p.ex)) m.set(p.ex, []); m.get(p.ex).push(p); }
  return [...m];
}

/* ===== 部品 ===== */
function boothBadge(e, size = "") {
  const n = e.booth != null ? e.booth : "–";
  if (size === "lg") return `<span class="booth lg" aria-label="ブースNo.${n}"><small>BOOTH</small>${n}</span>`;
  return `<span class="booth ${size}" aria-label="ブースNo.${n}">${n}</span>`;
}
const offerLbl = o => `<span class="lbl l-${o}">${OFFER_LABEL[o]}</span>`;
function exOffers(e) { return OFFER_ORDER.filter(o => e.offerSet.has(o) || (o === "free" && e.free)); }
function genresOf(e) { return Object.keys(GENRE_LABEL).filter(k => e.attrs.includes(k)).map(k => GENRE_LABEL[k]).join("／"); }
function pLabels(p) {
  let h = p.limited ? `<span class="lbl l-limited">会場限定</span>` : "";
  h += OFFER_ORDER.filter(o => p.offers.includes(o)).map(offerLbl).join("");
  for (const t of p.tags || []) h += `<span class="lbl ${t === "購入条件あり" ? "l-warn" : "l-plain"}">${esc(t)}</span>`;
  if (p.status === "soldout") h += `<span class="lbl l-warn">完売</span>`;
  if (p.status === "changed") h += `<span class="lbl l-warn">情報更新</span>`;
  return h;
}
const isPiped = p => !!(p.raw && p.raw.includes("|"));
function specLine(p) {
  const kana = kanaOf(p.name);
  if (!isPiped(p)) return kana;
  return [kana, p.age && `${p.age}年`, p.cask, p.abv && `${p.abv}%`].filter(Boolean).join(" ・ ");
}
function priceLine(p) {
  const sold = p.status === "soldout";
  let s = "";
  if (p.price) s = yen(p.price) + (p.venueStock ? ` ・ 会場販売${p.venueStock}本` : "");
  else if (p.enriched && has(p, "bottle")) s = "価格未発表";
  else if (p.enriched && has(p, "reserve")) s = "予約受付（ブースで確認）";
  if (!s) return "";
  return `<span class="prow-price${sold ? " muted" : ""}">${s}</span>`;
}
function exRow(e) {
  const sub = e.products.length
    ? exOffers(e).map(offerLbl).join("") + `<span class="cnt">${e.products.length}品</span>`
    : esc(["出品リスト未発表", e.free ? "無料試飲あり" : "", genresOf(e)].filter(Boolean).join("・"));
  return `<li><a class="exrow" href="${exHref(e)}">${boothBadge(e)}
    <span class="exrow-main"><span class="exrow-name">${hl(e.name)}${e.sponsor ? ` <span class="lbl l-plain">協賛</span>` : ""}</span>
    <span class="exrow-sub">${sub}</span></span><span class="chev" aria-hidden="true">›</span></a></li>`;
}
function pRow(p) {
  if (p.lineup) {
    const i = p.name.search(/[\s(（]/);
    const brand = i > 0 ? p.name.slice(0, i) : p.name, rest = i > 0 ? p.name.slice(i) : "";
    return `<li class="lrow"><span class="lrow-name"><b>${hl(brand)}</b>${hl(rest)}</span><span class="lbls">${pLabels(p)}</span></li>`;
  }
  const img = p.images && p.images[0];
  const spec = specLine(p);
  return `<li><a class="prow" href="${pHref(p)}">
    ${img ? `<img class="thumb" src="${esc(imgUrl(img, "small"))}" alt="" width="56" height="75" loading="lazy" decoding="async" onerror="this.remove()">` : ""}
    <span class="prow-main">
      ${p.series ? `<span class="prow-kicker">${esc(p.series)}</span>` : ""}
      <span class="prow-name">${hl(p.name)}</span>
      ${spec ? `<span class="prow-spec">${hl(spec)}</span>` : ""}
      <span class="lbls">${pLabels(p)}</span>
      ${priceLine(p)}
    </span><span class="chev" aria-hidden="true">›</span></a></li>`;
}
function noteRow(text) {
  const t = SHORT_NOTES.includes(text) ? `ほかにも提供があります（公式の表記：${text}）` : text;
  return `<li class="note-row">${esc(t)}</li>`;
}
function groupedList(ps) {
  return `<ul class="sheet">${groupByBooth(ps).map(([e, list]) => `<li>
    <a class="grp-head" href="${exHref(e)}">${boothBadge(e, "sm")}<span class="grp-name">${hl(e.name)}</span><span class="cnt">${list.length}件</span><span class="chev" aria-hidden="true">›</span></a>
    <ul class="sub">${list.map(pRow).join("")}</ul></li>`).join("")}</ul>`;
}
function clampBlock(text, lines, id) {
  return `<p class="clamp clamp${lines}" id="${id}">${esc(text)}</p>
    <button type="button" class="more" data-act="expand" data-target="${id}" aria-expanded="false" aria-controls="${id}">続きを読む</button>`;
}
function standaloneUrl() {
  if (SITE.standaloneUrl) return SITE.standaloneUrl.replace(/#.*$/, "");
  /* URLで埋め込んだ場合は、iframe 内のこのページ自体が単独URL（コード貼り付けの場合は googleusercontent.com になるので出さない） */
  if (/^https?:$/.test(location.protocol) && !/googleusercontent\.com$/.test(location.hostname)) return location.href.replace(/#.*$/, "");
  return "";
}
function fullscreenLink() {
  const u = standaloneUrl();
  if (!IN_FRAME || !u) return "";
  return ext(u + location.hash, "全画面", "fs");
}
function footer() {
  const c = SITE.contact || {};
  const contact = c.label ? `<p>訂正・掲載停止のご連絡：${c.url ? ext(c.url, esc(c.label)) : esc(c.label)}</p>` : "";
  return `<footer class="foot"><div class="wrap">
    <p><strong>非公式ガイド</strong>：主催者・出展社とは関係のない有志が作成しています。最新・正確な情報は ${ext(OFFICIAL_TOP, "公式サイト")} と各社SNSでご確認ください。</p>
    <p>出典：公式サイトの出展企業ページ（${fmtDate(D.fetchedAt)} 取得）、各出展社の公式SNS。価格・本数・内容は変更・完売の可能性があります。</p>
    <p>20歳未満の飲酒は法律で禁止されています。飲酒運転は絶対にやめましょう。</p>
    ${contact}</div></footer>`;
}

/* ===== 戻る ===== */
function route(h) {
  const parts = String(h ?? location.hash).replace(/^#\/?/, "").split("/").map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  const e = EX_BY[parts[1]];
  if (parts[0] === "e" && e) return { name: "ex", e };
  if (parts[0] === "p" && e && e.byId[parts[2]]) return { name: "product", e, p: e.byId[parts[2]] };
  if (parts[0] === "limited") return { name: "limited" };
  return { name: "home" };
}
function labelFor(h) {
  const r = route(h);
  if (r.name === "home") return S.q.trim() ? "検索結果" : "一覧";
  if (r.name === "limited") return "限定ボトル一覧";
  if (r.name === "ex") return boothName(r.e);
  return "商品";
}
function backInfo() {
  const st = NAV.stack;
  if (st.length >= 2) return { label: labelFor(st[st.length - 2]), hist: true };
  const r = route();
  const hash = r.name === "product" ? exHref(r.e) : "#/";
  return { label: labelFor(hash), hash };
}
function backbar(title) {
  return `<div class="backbar"><div class="wrap">
    <button type="button" class="back" data-act="back">‹ ${esc(backInfo().label)}</button>
    <span class="backbar-title">${esc(title)}</span>${fullscreenLink()}</div></div>`;
}

/* ===== 画面：ホーム ===== */
function chipsHtml() {
  let h = "";
  CHIP_GROUPS.forEach((g, i) => {
    if (i) h += `<span class="chip-sep" aria-hidden="true"></span>`;
    h += g.map(c => `<button type="button" class="chip" data-act="chip" data-k="${c.k}" aria-pressed="${S.sel.has(c.k)}">${c.label}</button>`).join("");
  });
  if (S.sel.size) h += `<button type="button" class="chip-clear" data-act="clearsel">解除</button>`;
  return h;
}
function renderHome() {
  APP.innerHTML = `

      <label class="sr" for="q">銘柄・蒸留所・出展社・ブースNo.で検索</label>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="銘柄・蒸留所・出展社・ブースNo." value="${esc(S.q)}">

function homeListHtml() {
  const list = EX.filter(passEx);
  const filtering = S.sel.size > 0;
  const n = SITE.notice || {};
  let h = `<p class="meta"><strong>${filtering ? `${list.length}社 / ${EX.length}社` : `${EX.length}社`}</strong>
    <span>データ ${esc(fmtDate(D.fetchedAt))} 時点</span>${ext(MAP_URL, "会場図（公式）", "extlink")}</p>`;
  if (n.text) h += `<p class="notice">更新 ${esc(n.date)} ${esc(n.text)}</p>`;
  h += `<p class="disclaimer">ⓘ 主催者・出展社とは関係のない有志のガイドです。最新情報は公式サイト・各社SNSで。会場に着く前に一度開いておくと安心です。</p>`;
  if (!filtering && FEATURED.length) {
    h += `<section><h2 class="sec-h">写真付きの限定ボトル</h2><ul class="featured">${FEATURED.map(p => `<li><a class="fcard" href="${pHref(p)}">
      <span class="ph"><img src="${esc(imgUrl(p.images[0], "small"))}" alt="${esc(p.name)} のボトル写真" loading="lazy" decoding="async" onerror="this.remove()"></span>
      <span class="lbls">${p.limited ? `<span class="lbl l-limited">会場限定</span>` : ""}${p.status === "soldout" ? `<span class="lbl l-warn">完売</span>` : ""}</span>
      <span class="fcard-name">${esc(p.name)}</span>
      <span class="fcard-price${p.status === "soldout" ? " muted" : ""}">${p.price ? yen(p.price) : has(p, "reserve") && !has(p, "bottle") ? "予約受付" : "価格未発表"}</span>
      <span class="fcard-ex">${boothBadge(p.ex, "xs")}${esc(p.ex.name)}</span></a></li>`).join("")}</ul>
      <a class="seeall" href="#/limited">限定ボトルをすべて見る（${LIMITED.length}件・ブース順）<span class="chev" aria-hidden="true">›</span></a></section>`;
  }
  h += `<h2 class="sec-h">出展社（ブースNo.順）</h2>`;
  h += list.length ? `<ul class="sheet">${list.map(exRow).join("")}</ul>`
    : `<div class="empty"><p class="empty-t">条件に合う出展社はありません</p><button type="button" class="btn" data-act="clearsel">絞り込みを解除</button></div>`;
  announce(`${list.length}社`);
  return h;
}
function resultsHtml(q) {
  const { boothHit, exHits, pHits } = search(q);
  let h = "";
  if (boothHit) h += `<h2 class="sec-h">ブースNo.${boothHit.booth}</h2><ul class="sheet">${exRow(boothHit)}</ul><p class="fine">Enter でこのブースを開きます</p>`;
  if (exHits.length) h += `<h2 class="sec-h">出展社（${exHits.length}）</h2><ul class="sheet">${exHits.map(exRow).join("")}</ul>`;
  if (pHits.length) {
    const limit = !S.more && pHits.length > 100 ? 50 : pHits.length;
    const shown = pHits.slice(0, limit);
    h += `<h2 class="sec-h">商品（${pHits.length}件・${groupByBooth(pHits).length}ブース）</h2>${groupedList(shown)}`;
    if (limit < pHits.length) h += `<button type="button" class="morebtn" data-act="more">さらに表示（残り${pHits.length - limit}件）</button>`;
  }
  if (!boothHit && !exHits.length && !pHits.length) {
    h += `<div class="empty"><p class="empty-t">「${esc(q)}」は見つかりませんでした</p>
      <p class="fine">カタカナ／英語の表記を変えてお試しください。</p>
      <div class="chips">${["ラフロイグ", "ミズナラ", "30年"].map(x => `<button type="button" class="chip" data-act="example" data-q="${x}">${x}</button>`).join("")}</div>
      ${S.sel.size ? `<button type="button" class="btn" data-act="clearsel">絞り込みを解除</button>` : ""}</div>`;
  }
  h += `<p class="footnote">※出品リスト未発表の出展社（${UNLISTED_N}社）は検索の対象外です。<button type="button" class="linkish" data-act="clearq">出展社一覧を見る</button></p>`;
  announce(`商品${pHits.length}件、出展社${exHits.length + (boothHit ? 1 : 0)}件`);
  return h;
}
function updateResults() {
  const box = document.getElementById("results");
  if (!box) return;
  const chips = document.getElementById("chips");
  const focusedChip = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  chips.innerHTML = chipsHtml();
  if (focusedChip) { const b = chips.querySelector(`[data-k="${focusedChip}"]`); if (b) b.focus({ preventScroll: true }); }
  const q = S.q.trim();
  if (!q) S.hl = null;
  box.innerHTML = q ? resultsHtml(q) : homeListHtml();
  const clear = APP.querySelector(".clear");
  if (clear) clear.hidden = !S.q;
}
let liveTimer;
function announce(text) {
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => { document.getElementById("live").textContent = text; }, 300);
}
function bindSearch() {
  const inp = document.getElementById("q");
  let t;
  const apply = () => {
    S.q = inp.value; S.more = false;
    try { sessionStorage.setItem("wf26-q", S.q); } catch (e) { /* 保存できなくても動作に影響なし */ }
    updateResults();
  };
  inp.addEventListener("input", ev => { if (ev.isComposing) return; clearTimeout(t); t = setTimeout(apply, 60); });
  inp.addEventListener("compositionend", () => { clearTimeout(t); t = setTimeout(apply, 0); });
  inp.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" || ev.isComposing || ev.keyCode === 229) return;
    ev.preventDefault();
    clearTimeout(t); apply();
    const v = inp.value.trim();
    const hit = /^\d{1,3}$/.test(v) && BOOTHS.find(e => e.booth === Number(v));
    if (hit) location.hash = exHref(hit); else inp.blur();
  });
}

/* ===== 画面：出展社詳細 ===== */
function tabCounts(e) {
  return TABS.map(t => ({ ...t, n: t.k === "all" ? e.products.length : e.products.filter(p => t.offers.some(o => p.offers.includes(o))).length }))
    .filter(t => t.k === "all" || t.n > 0);
}
function productListHtml(e, tab) {
  const def = TABS.find(t => t.k === tab) || TABS[0];
  const seen = new Set();
  let h = "";
  if (tab === "all") {
    if (e.free && !e.offerSet.has("free")) h += `<p class="info">無料試飲あり（銘柄は公式に未掲載）</p>`;
    const pinned = e.products.filter(p => p.enriched);
    if (pinned.length) {
      h += `<h2 class="sec-h">注目・会場限定</h2><ul class="sheet">${pinned.map(pRow).join("")}</ul>`;
      pinned.forEach(p => seen.add(p.id));
    }
  }
  for (const sec of e.sections) {
    if (tab !== "all" && !def.offers.includes(sec.offer)) continue;
    let body = "";
    for (const g of sec.groups) {
      let rows = "";
      for (const it of g.items) {
        if (typeof it === "object") { rows += noteRow(it.note); continue; }
        if (seen.has(it)) continue; /* 同じ商品は最初に出た位置だけに出す */
        seen.add(it);
        rows += pRow(e.byId[it]);
      }
      if (rows) body += (g.title ? `<li class="grp-h">${esc(g.title)}</li>` : "") + rows;
    }
    if (body) h += `<h2 class="sec-h">${esc(sec.title)}</h2><ul class="sheet">${body}</ul>`;
  }
  return h;
}
function renderEx(e) {
  const tabs = tabCounts(e);
  const cur = tabs.some(t => t.k === S.tab[e.slug]) ? S.tab[e.slug] : "all";
  const genres = genresOf(e);
  const idx = BOOTHS.indexOf(e);
  const prev = BOOTHS[idx - 1], next = BOOTHS[idx + 1];
  const L = e.links || {};
  const linkBtns = [["site", "公式サイト"], ["x", "X"], ["instagram", "Instagram"], ["facebook", "Facebook"], ["youtube", "YouTube"], ["official", "公式出展ページ"]]
    .filter(([k]) => L[k]).map(([k, label]) => ext(L[k], label, "linkbtn")).join("");
  const sns = [...new Map(e.products.flatMap(p => p.sources || []).map(s => [s.url, s])).values()];
  const snsDates = [...new Set(sns.map(s => `${s.label}（${fmtDate(s.date)}）`))];
  APP.innerHTML = `${backbar(boothName(e))}
  <main class="wrap">
    <header class="exhead">${boothBadge(e, "lg")}<div class="exhead-main">
      <h1 tabindex="-1">${esc(e.name)}</h1>
      ${genres ? `<p class="genres">${esc(genres)}</p>` : ""}
      <div class="lbls">${e.free ? `<span class="lbl l-free">無料試飲あり</span>` : ""}${e.sponsor ? `<span class="lbl l-plain">協賛</span>` : ""}</div>
      ${ext(MAP_URL, "会場図（公式）", "extlink")}
    </div></header>
    ${e.special ? `<section class="special"><h2>★ 特別企画</h2>${clampBlock(e.special, 4, "special")}</section>` : ""}
    ${e.products.length ? `
      <div class="tabs" role="tablist" aria-label="提供形態で絞り込み">${tabs.map(t =>
        `<button type="button" class="tab" role="tab" data-act="tab" data-k="${t.k}" aria-selected="${t.k === cur}" aria-controls="plist">${t.label}<span class="n">${t.n}</span></button>`).join("")}</div>
      <div id="plist" role="tabpanel">${productListHtml(e, cur)}</div>`
    : `<div class="info"><p>出品アイテムは公式サイトで未発表です（11/5 に再確認予定）。</p>${e.free ? `<p>無料試飲あり（銘柄は公式に未掲載）</p>` : ""}${L.official ? ext(L.official, "公式出展ページ", "extlink") : ""}</div>`}
    <section class="about"><h2 class="sec-h">この出展社について</h2>
      ${e.intro ? clampBlock(e.intro, 2, "intro") : ""}
      <div class="linkbtns">${linkBtns}</div>
      <p class="src">出典：公式出展ページ（${esc(fmtDate(D.fetchedAt))} 取得）${snsDates.map(s => "・" + esc(s)).join("")}</p>
    </section>
    <nav class="pager" aria-label="前後のブース">
      ${prev ? `<a href="${exHref(prev)}"><small>‹ 前の番号</small>${esc(boothName(prev))}</a>` : "<span></span>"}
      ${next ? `<a class="next" href="${exHref(next)}"><small>次の番号 ›</small>${esc(boothName(next))}</a>` : "<span></span>"}
    </nav>
  </main>${footer()}`;
}

/* ===== 画面：商品詳細 ===== */
function priceBlock(p) {
  const sold = p.status === "soldout";
  let main = "";
  if (p.price) main = `<p class="price-main${sold ? " muted" : ""}">${num(p.price)}<span class="yen">円</span><span class="tax">（税込）</span></p>`;
  else if (has(p, "bottle")) main = `<p class="price-main na">販売価格：未発表</p>`;
  if (sold) main = `<p class="lbls" style="margin:0 0 6px"><span class="lbl l-warn">完売</span></p>` + main;
  const rows = [];
  if (p.tasting) rows.push(["有料試飲", `${num(p.tasting.price)}円／${p.tasting.ml}ml`]);
  if (p.venueStock) rows.push(["会場販売", `${p.venueStock}本` + (p.bottles ? `（総本数 ${p.bottles}本）` : "")]);
  if (has(p, "reserve")) rows.push(["予約受付", "料金・方法はブースで確認してください"]);
  if ((p.tags || []).includes("購入条件あり")) rows.push(["購入条件", "条件はブースで確認してください"]);
  if (p.status === "changed") rows.push(["お知らせ", "価格などの情報が更新されています"]);
  if (!main && !rows.length) return "";
  return `<section class="priceblock" aria-label="価格">${main}
    ${rows.length ? `<dl class="price-rows">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : ""}
    <p class="fine">※価格・本数は変更・完売の可能性があります</p></section>`;
}
function specRows(p) {
  const rows = [];
  if (p.distillery || p.region) rows.push(["蒸留所・地域", p.distillery ? p.distillery + (p.region ? `（${p.region}）` : "") : p.region]);
  if (p.category) rows.push(["分類", p.category]);
  const span = p.vintage ? `${p.vintage} 蒸留${p.bottled ? ` → ${p.bottled} 瓶詰` : ""}` : "";
  if (p.age || span) rows.push(["熟成", p.age ? `${p.age}年${span ? `（${span}）` : ""}` : span]);
  if (p.cask || p.caskNo) rows.push(["樽", [p.cask, p.caskNo].filter(Boolean).join("　")]);
  if (p.abv || p.volume) rows.push(["度数・容量", [p.abv && `${p.abv}%`, p.volume].filter(Boolean).join(" ・ ")]);
  if (p.bottles && !p.venueStock) rows.push(["総本数", `${p.bottles}本`]);
  if (p.bottler) rows.push(["ボトラー", p.bottler]);
  if (p.group && !p.series) rows.push(["公式の分類", p.group]);
  if (p.notes && p.notes.length) rows.push(["メモ", p.notes.join("／")]);
  return rows;
}
function renderProduct(e, p) {
  const full = !!(p.enriched || p.price || p.limited || (p.images && p.images.length));
  const rows = specRows(p);
  const kana = kanaOf(p.name);
  const official = !p.enriched || !!p.raw;
  const imgs = (p.images || []).slice(0, 4);
  const src0 = (p.sources || [])[0];
  const others = e.products.filter(x => x !== p && !x.lineup);
  APP.innerHTML = `${backbar("")}
  <main class="wrap pd">
    ${p.series || p.headline ? `<p class="pd-kicker">${esc([p.series, p.headline].filter(Boolean).join("・"))}</p>` : `<div class="pd-top"></div>`}
    <h1 tabindex="-1">${esc(p.name)}</h1>
    ${p.nameEn ? `<p class="pd-en">${esc(p.nameEn)}</p>` : kana ? `<p class="pd-en">${esc(kana)}</p>` : ""}
    <div class="lbls">${pLabels(p)}</div>
    <a class="boothblock" href="${exHref(e)}">${boothBadge(e)}<span class="boothblock-main">
      <span class="boothblock-name">${esc(e.name)}</span><span class="boothblock-sub">ブースNo.${e.booth ?? "–"} ・ 出展社の商品一覧へ</span></span>
      <span class="chev" aria-hidden="true">›</span></a>
    ${full ? priceBlock(p) : `<p class="info">ⓘ ${rows.length ? "価格は未発表です（公式の出品リストに名前とスペックのみ掲載）" : "価格・スペックは未発表です（公式の出品リストに名前のみ掲載）"}</p>`}
    ${imgs.length ? `<section class="tiles-wrap"><div class="tiles">${imgs.map((u, i) =>
      `<a class="tile" href="${esc(imgUrl(u, "large"))}" target="_blank" rel="noopener"><img src="${esc(imgUrl(u, "small"))}" alt="${esc(p.name)} の${i === 0 ? "ボトル写真" : "ラベル"}" loading="lazy" decoding="async" onerror="wfImgFail(this)"></a>`).join("")}</div>
      <p class="caption">画像：${src0 ? `${esc(src0.label)}（${esc(src0.date)}）` : "出展社の公開画像"} ・ タップで拡大</p></section>` : ""}
    ${rows.length ? `<section><h2 class="sec-h">スペック</h2><dl class="spec">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></section>` : ""}
    <section><h2 class="sec-h">出典</h2><ul class="srcs">
      ${(p.sources || []).map(s => `<li>${ext(s.url, `${esc(s.label)}（${esc(s.date)}）`)}</li>`).join("")}
      ${official ? `<li>${ext(e.links.official, `公式出展ページ（${esc(fmtDate(D.fetchedAt))} 取得）`)}</li><li class="raw">公式の表記：「${esc(p.raw || p.name)}」</li>` : ""}
    </ul></section>
    ${others.length ? `<section><h2 class="sec-h">同じブースのほかの商品</h2><ul class="sheet">${others.slice(0, 6).map(pRow).join("")}</ul>
      <a class="seeall" href="${exHref(e)}">${esc(boothName(e))} の商品をすべて見る（${e.products.length}件）<span class="chev" aria-hidden="true">›</span></a></section>` : ""}
  </main>${footer()}`;
}

/* ===== 画面：限定ボトル一覧 ===== */
function renderLimited() {
  S.hl = null;
  APP.innerHTML = `${backbar("限定ボトル一覧")}
  <main class="wrap">
    <h1 class="page-h1" tabindex="-1">会場限定ボトル（${LIMITED.length}件）</h1>
    <p class="lead">公式の出品リストに「フェス限定」「イベント限定」「フェスボトル」などと書かれた商品と、出展社のSNSで告知された会場限定品です。「数量限定」「蒸溜所限定」などは含みません。ブースNo.順。</p>
    ${groupedList(LIMITED)}
  </main>${footer()}`;
}

/* ===== 描画とイベント ===== */
function render(isBack) {
  const r = route();
  try {
    if (r.name === "home") renderHome();
    else { S.hl = null; if (r.name === "ex") renderEx(r.e); else if (r.name === "product") renderProduct(r.e, r.p); else renderLimited(); }
  } catch (err) {
    console.error(err);
    APP.innerHTML = `<div class="loading"><strong>表示できませんでした</strong>再読み込みしてください。${ext(OFFICIAL_TOP, "公式サイト")}</div>`;
    return;
  }
  APP.querySelectorAll(".clamp").forEach(el => {
    const btn = APP.querySelector(`[data-target="${el.id}"]`);
    if (btn && el.scrollHeight <= el.clientHeight + 2) btn.hidden = true;
  });
  window.scrollTo(0, isBack ? (NAV.scroll[location.hash || "#/"] || 0) : 0);
  if (NAV.rendered) { const h1 = APP.querySelector("h1"); if (h1) h1.focus({ preventScroll: true }); }
  NAV.rendered = true;
}
function onRoute() {
  const h = location.hash || "#/";
  const st = NAV.stack;
  let isBack = false;
  if (st.length >= 2 && st[st.length - 2] === h) { st.pop(); isBack = true; }
  else if (st[st.length - 1] !== h) st.push(h);
  render(isBack);
}
window.addEventListener("hashchange", onRoute);
window.addEventListener("scroll", () => { NAV.scroll[location.hash || "#/"] = window.scrollY; }, { passive: true });

APP.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  const inp = document.getElementById("q");
  if (act === "chip") {
    S.sel.has(b.dataset.k) ? S.sel.delete(b.dataset.k) : S.sel.add(b.dataset.k);
    S.more = false; updateResults();
  } else if (act === "clearsel") {
    S.sel.clear(); updateResults();
  } else if (act === "clear" || act === "clearq") {
    S.q = ""; S.more = false;
    try { sessionStorage.removeItem("wf26-q"); } catch (e) { /* 無視 */ }
    if (inp) inp.value = "";
    updateResults();
    if (act === "clear" && inp) inp.focus();
  } else if (act === "example") {
    S.q = b.dataset.q; if (inp) inp.value = S.q; updateResults();
  } else if (act === "more") {
    S.more = true; updateResults();
  } else if (act === "back") {
    const info = backInfo();
    if (info.hist) history.back(); else location.hash = info.hash;
  } else if (act === "tab") {
    const e = route().e;
    S.tab[e.slug] = b.dataset.k;
    APP.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t === b)));
    const list = document.getElementById("plist");
    list.innerHTML = productListHtml(e, b.dataset.k);
    const top = list.getBoundingClientRect().top + window.scrollY - 48 - 46;
    if (window.scrollY > top) window.scrollTo(0, top);
  } else if (act === "expand") {
    const el = document.getElementById(b.dataset.target);
    const open = el.classList.toggle("open");
    b.setAttribute("aria-expanded", String(open));
    b.textContent = open ? "閉じる" : "続きを読む";
  }
});

onRoute();
})();
</script>
</body>
</html>
